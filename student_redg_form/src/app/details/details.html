<h2>Entered Details</h2>

<div *ngIf="userData; else noData">
  <p><b>Name:</b> {{ userData.fullName }}</p>
  <p><b>Email:</b> {{ userData.email }}</p>
  <p><b>Phone:</b> {{ userData.phone }}</p>
  <p><b>Age:</b> {{ userData.age }}</p>
  <p><b>Gender:</b> {{ userData.gender }}</p>
  <p><b>Address:</b> {{ userData.address }}</p>
</div>

<ng-template #noData>
  <p>No details found. Please fill the form first.</p>
</ng-template>

<br>
<a routerLink="/">Back to Form</a>
